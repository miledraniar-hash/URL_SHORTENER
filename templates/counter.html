<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Click Counter</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="counter-page">

        <div class="counter-card">

            <a
                href="/"
                class="back-btn"
            >
                ← Back to URL Shortener
            </a>


            <div class="counter-icon">
                📊
            </div>


            <h1>
                Click Counter
            </h1>


            <p class="counter-url">
                {{ request.base_url }}{{ url.short_code }}
            </p>


            <div class="counter-number-container">

                <span id="click-count">
                    {{ click_count }}
                </span>

            </div>


            <p class="counter-label">
                Total Clicks
            </p>


            <div class="counter-status">

                <span class="status-dot"></span>

                Live counter

            </div>

        </div>

    </div>


    <!-- Data generated by Jinja -->

    <div
        id="counter-data"
        data-url-id="{{ url.id }}"
        data-click-count="{{ click_count }}"
    ></div>


    <script>

        const counterData =
            document.getElementById(
                "counter-data"
            );


        const urlId =
            parseInt(
                counterData.dataset.urlId
            );


        let currentCount =
            parseInt(
                counterData.dataset.clickCount
            );


        async function updateClickCount() {

            try {

                const response =
                    await fetch(
                        `/api/clicks/${urlId}`
                    );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                const newCount =
                    data.click_count;


                if (
                    newCount !==
                    currentCount
                ) {

                    animateCounter(
                        currentCount,
                        newCount
                    );


                    currentCount =
                        newCount;
                }

            } catch (error) {

                console.error(
                    "Counter error:",
                    error
                );

            }

        }


        function animateCounter(
            oldValue,
            newValue
        ) {

            const element =
                document.getElementById(
                    "click-count"
                );


            const duration = 500;

            const startTime =
                performance.now();


            function animation(
                currentTime
            ) {

                const elapsed =
                    currentTime -
                    startTime;


                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );


                const value =
                    Math.floor(
                        oldValue +
                        (
                            newValue -
                            oldValue
                        ) *
                        progress
                    );


                element.textContent =
                    value;


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        animation
                    );

                }

            }


            requestAnimationFrame(
                animation
            );

        }


        // Vérification automatique
        // toutes les secondes

        setInterval(
            updateClickCount,
            1000
        );

    </script>

</body>

</html>
