<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - URLShortener</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-page">

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <a href="/">
                URL<span>Shortener</span>
            </a>
        </div>

        <ul class="nav-links">
            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/signin" class="account-btn">
                    Create Account
                </a>
            </li>
        </ul>

    </nav>


    <!-- LOGIN SECTION -->
    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your URLShortener account
            </p>

            {% if error %}
            <p class="form-error">
                {{ error }}
            </p>
            {% endif %}


            <form action="/login" method="POST">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                        <a href="/forgot-password">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- SIGN UP -->
            <p class="signup-text">

                Don't have an account?

                <a href="/signin">
                    Create Account
                </a>

            </p>

        </div>

    </main>


</body>
</html>
