<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - URLShortener</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-page">

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            <a href="/">
                URL<span>Shortener</span>
            </a>
        </div>

        <ul class="nav-links">
            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/login" class="account-btn">
                    Login
                </a>
            </li>
        </ul>

    </nav>


    <!-- SIGNUP SECTION -->
    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                ✨
            </div>

            <h1>Créer un compte</h1>

            <p class="login-subtitle">
                Débloquez le QR Code en créant votre compte
            </p>

            {% if error %}
            <p class="form-error">
                {{ error }}
            </p>
            {% endif %}


            <form action="/signin" method="POST">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Entrez votre email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Choisissez un mot de passe"
                        required
                        minlength="8"
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="password_confirm">
                        Confirmez le mot de passe
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        placeholder="Retapez votre mot de passe"
                        required
                        minlength="8"
                    >

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Créer mon compte
                </button>

            </form>


            <!-- OAUTH DIVIDER -->
            <div class="oauth-divider">
                <span>ou</span>
            </div>


            <!-- GOOGLE (placeholder - needs OAuth credentials) -->
            <button
                type="button"
                class="oauth-btn oauth-google"
                disabled
                title="Bientôt disponible"
            >
                <span>G</span>
                Continuer avec Google
            </button>


            <!-- APPLE (placeholder - needs OAuth credentials) -->
            <button
                type="button"
                class="oauth-btn oauth-apple"
                disabled
                title="Bientôt disponible"
            >
                <span></span>
                Continuer avec Apple
            </button>


            <!-- LOGIN LINK -->
            <p class="signup-text">
                Déjà un compte ?
                <a href="/login">Se connecter</a>
            </p>

        </div>

    </main>

</body>
</html>
