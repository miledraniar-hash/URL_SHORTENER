<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="hero">
    <nav>
        <h2 class="logo">********</h2>
        <ul>
            <li>Home</li>
            <li>Login</li>
            <li>Sign Up</li>
        </ul>
    </nav>

    <div class="content">
        <h1>Best Shorten URLs</h1>
        
        <form action="/shorten" method="post" class="shortener-box">
            <input type="text" name="original_url" placeholder="Your URL here" required>
            <button type="submit">Shorten</button>
        </form>

        {% if short_url %}
            <div class="result">
                <span>Short URL:</span>
                <a href="{{ short_url }}" target="_blank" id="short-url-link">{{ short_url }}</a>
                <button type="button" id="copy-btn" onclick="copyShortUrl()">Copy</button>
            </div>
        {% endif %}
    </div>
</div>

<script src="/static/css/js/script.js"></script>
</body>
</html>
