<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="hero">
    <nav>
        <h2 class="logo">AdLinkFly</h2>
        <ul>
            <li>Home</li>
            <li>Publisher Rates</li>
            <li>Blog</li>
            <li>Login</li>
            <li>Sign Up</li>
        </ul>
    </nav>

    <div class="content">
        <h1>Best Shorten URLs</h1>
        <p>Earn up to 20$ / 1000 views</p>

        <form action="/shorten" method="post" class="shortener-box">
            <input type="text" name="original_url" placeholder="Your URL here" required>
            <button type="submit">Shorten</button>
        </form>

        {% if short_url %}
            <p class="result">Short URL: {{ short_url }}</p>
        {% endif %}
    </div>
</div>

</body>
</html>
